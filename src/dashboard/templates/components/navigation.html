{% macro navigation_menu(navigation, page_id) %}
<nav class="sidebar-nav" aria-label="Primary navigation">
  <p class="nav-section-label">Workspace</p>
  <ul class="nav-list">
    {% for item in navigation %}
    <li>
      <a class="nav-link{% if item.id == page_id %} is-active{% endif %}"
         href="{{ item.href }}"
         {% if item.id == page_id %}aria-current="page"{% endif %}>
        <span class="nav-icon nav-icon-{{ item.id }}" aria-hidden="true"></span>
        <span>{{ item.label }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
</nav>
{% endmacro %}

{% macro theme_toggle() %}
<button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme">
  <span class="theme-toggle-icon" data-theme-icon aria-hidden="true">☾</span>
  <span data-theme-label>Dark mode</span>
  <span class="theme-toggle-switch" aria-hidden="true"><span></span></span>
</button>
{% endmacro %}
