{% macro chart_card(title, description, chart, extra_class="") %}
<section class="panel chart-panel {{ extra_class }}" aria-label="{{ title }}">
  <div class="panel-heading">
    <div>
      <h2>{{ title }}</h2>
      <p>{{ description }}</p>
    </div>
  </div>
  <div class="chart-wrap">{{ chart }}</div>
</section>
{% endmacro %}
