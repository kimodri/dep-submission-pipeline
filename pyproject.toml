[project]
name = "dep-submission-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.5.1",
    "jinja2>=3.1.6",
    "pandas>=3.0.5",
    "plotly>=6.3.0",
    "python-dotenv>=1.2.2",
    "pytz>=2026.3.post1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "playwright>=1.55.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline", "src/analytics", "src/dashboard"]

[project.scripts]
dep-pipeline-prod = "pipeline.__main__:main"
dep-pipeline-dev = "pipeline.__main__:dev"
dep-pipeline-silver-manual = "pipeline.__main__:silver_manual"
dep-pipeline-gold-manual = "pipeline.__main__:gold_manual"
dep-dashboard-build = "dashboard.__main__:main"
